<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayfa Bulunamadı | Gül Perde ve Ev Tekstili</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Jost', system-ui, sans-serif;
      background: #faf8f5;
      color: #2c2420;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      padding: 20px 32px;
      border-bottom: 1px solid #e2d9ce;
      background: rgba(250,248,245,.97);
    }
    .logo-main { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: #2c2420; text-decoration: none; }
    .logo-sub  { font-size: 11px; color: #a89080; display: block; letter-spacing: .5px; }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      text-align: center;
    }
    .wrap { max-width: 520px; }

    .code {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(80px, 18vw, 140px);
      font-weight: 300;
      color: #e2d9ce;
      line-height: 1;
      margin-bottom: 8px;
    }
    .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 400;
      color: #2c2420;
      margin-bottom: 16px;
    }
    .desc {
      font-size: 14px;
      color: #6b5c52;
      line-height: 1.7;
      margin-bottom: 36px;
    }
    .divider {
      width: 48px;
      height: 1px;
      background: #c9a96e;
      margin: 0 auto 32px;
    }
    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 10px 22px;
      border-radius: 30px;
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all .2s;
    }
    .btn-primary { background: #8b6f5e; color: #fff; }
    .btn-primary:hover { background: #6e5448; }
    .btn-outline { border: 1px solid #e2d9ce; color: #6b5c52; background: #fff; }
    .btn-outline:hover { border-color: #8b6f5e; color: #8b6f5e; }

    /* FOOTER */
    footer {
      padding: 20px 32px;
      border-top: 1px solid #e2d9ce;
      text-align: center;
      font-size: 12px;
      color: #a89080;
    }
    footer a { color: #8b6f5e; text-decoration: none; }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo-main">
    Gül Perde
    <span class="logo-sub">ve Ev Tekstili</span>
  </a>
</header>

<main>
  <div class="wrap">
    <div class="code">404</div>
    <h1 class="title">Aradığınız sayfa bulunamadı</h1>
    <div class="divider"></div>
    <p class="desc">
      Bu sayfa taşınmış, silinmiş ya da hiç var olmamış olabilir.<br>
      Aşağıdaki bağlantılardan devam edebilirsiniz.
    </p>
    <div class="links">
      <a href="/" class="btn btn-primary">Ana Sayfa</a>
      <a href="/blog/" class="btn btn-outline">Blog</a>
      <a href="/referans/" class="btn btn-outline">Referanslar</a>
      <a href="/#contact" class="btn btn-outline">İletişim</a>
    </div>
  </div>
</main>

<footer>
  <p>© 2025 <a href="/">Gül Perde ve Ev Tekstili</a> · Osmaniye · <a href="tel:+905556119343">0555 611 9343</a></p>
</footer>

<script src="/kvkk.js"></script>
</body>
</html>
